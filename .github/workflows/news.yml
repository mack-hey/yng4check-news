name: Update news
on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: news, cancel-in-progress: true }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "yng4check-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news
          git diff --cached --quiet || (git commit -m "news: $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
